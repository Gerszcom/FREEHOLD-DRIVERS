# Drivers are FREEHOLD programs: the stable UEFI target, which emits PE64.
[build]
target = "x86_64-unknown-uefi"

# `cargo drivers build | release N | current N | sign` — the drivers' build tool
# (tools/drvtool), run on this machine whatever it is (host-tuple: Windows,
# Linux, macOS), so building needs nothing but Rust.
[alias]
drivers = "run --quiet --package drvtool --target host-tuple --"
