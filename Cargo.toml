# FREEHOLD-DRIVERS — FREEHOLD's user-mode drivers, outside the kernel
# (FREEHOLD's DECISIONS.md, D-127, D-215). Each driver is an ordinary
# FREEHOLD program built for the UEFI target (PE64), as FREEHOLD's own
# programs are.
#
# The drivers depend on FREEHOLD's runtime (`freehold-rt` -> `freehold-abi`),
# which stays in the FREEHOLD repository. This workspace resolves it from a
# sibling checkout — clone `Gerszcom/freehold` next to this repository:
#
#   /some/dir/freehold           (the OS: kernel, rt, abi, gate harness)
#   /some/dir/freehold-drivers   (this repository)
#
# `cargo drivers build` builds every driver and packages it (dist/): the
# alias runs tools/drvtool on the machine you build on — Windows, Linux or
# macOS — with nothing but Rust.

[workspace]
resolver = "2"
members = [
    "drivers/rtl8139",
    "drivers/e1000",
    "drivers/nvrtx",
    "drivers/virtnet",
    "crates/freehold-rtx",
    "tools/drvtool",
]
# A plain `cargo build` builds the drivers (for the UEFI target, as set in
# .cargo/config.toml); the tool is built for the host by its alias.
default-members = [
    "drivers/rtl8139",
    "drivers/e1000",
    "drivers/nvrtx",
    "drivers/virtnet",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Gerszcom/FREEHOLD-DRIVERS"

# FREEHOLD's release profile, unchanged: overflow checks stay on, size and
# speed from LTO and a single codegen unit.
[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
overflow-checks = true
debug = 1

[profile.dev]
panic = "abort"
opt-level = 1
